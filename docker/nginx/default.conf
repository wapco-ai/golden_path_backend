server {
  listen 80;
  server_name _;

  root /var/www/html/public;
  index index.php index.html;

  client_max_body_size 200M;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    fastcgi_pass gp_app:9000;   # 👈 اینجا رو از app:9000 به gp_app:9000 تغییر بده
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
}

  location ~ /\.ht {
    deny all;
  }

  location /tiles/ {
        proxy_pass http://gp_pg_tileserv:7800/;
        proxy_http_version 1.1;
        proxy_no_cache 1;
  proxy_cache_bypass 1;
  add_header Cache-Control "no-store" always;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;

        #if ($request_method = OPTIONS) {
        #    return 204;
        #}
    }

  location /tms/ {
  proxy_pass http://gp_tiles:8000/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;

  # Cache بهتر برای تایل‌ها
  expires 7d;
  add_header Cache-Control "public, max-age=604800" always;
}


  location ^~ /storage/ {
    alias /var/www/html/public/storage/;
    try_files $uri =404;
    access_log off;
    expires 30d;
  }

  location /fonts/ {
  proxy_pass http://gp_fonts:8080/fonts/;

  proxy_http_version 1.1;

  # 1) اگر upstream هم CORS می‌فرستد، مخفی کن تا دو تا نشود
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;

  # 2) فقط یک بار CORS را اینجا بفرست
  add_header Access-Control-Allow-Origin "http://localhost:5173" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;

  if ($request_method = OPTIONS) {
    return 204;
  }
  }

}
