version: "3.9"
services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    container_name: gp_db
    environment:
      POSTGRES_DB: golden_path
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    # برای workloadهای سنگین بهتره shared memory رو زیاد کنی
    shm_size: "1g"

    # روی Docker Desktop / لینوکس معمولی جواب می‌دهد:
    mem_limit: "8g"     # بسته به رم سیستم
    cpus: "4"           # بسته به تعداد هسته

    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gp_redis
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: gp_app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./src/docker-data/uploads:/var/www/html/storage/app/public/uploads
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: golden_path
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: UTC
    restart: unless-stopped

  queue:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
    container_name: gp_queue
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./src/docker-data/uploads:/var/www/html/storage/app/public/uploads
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: golden_path
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      TZ: UTC
    command: php artisan queue:work database --queue=graph,default --timeout=900 --tries=2 --sleep=1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gp_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/docker-data/uploads:/var/www/html/storage/app/public/uploads
    depends_on:
      - app

    environment:
      TZ: UTC
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: gp_adminer
    ports:
      - "8081:8080"
    restart: unless-stopped

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    container_name: gp_pg_tileserv
    environment:
      # اتصال به همین دیتابیس golden_path
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@db:5432/golden_path
      # پورت داخلی سرویس
      - TS_HTTPPORT=7800
      # سطح لاگ (info / debug / warn)
      - TS_LOG_LEVEL=info
    depends_on:
      - db
    expose:
      - "7800"
    # اگر خواستی برای تست مستقیم هم در دسترس باشه، می‌تونی این رو هم اضافه کنی:
    ports:
     - "7800:7800"
    restart: unless-stopped

  gp_fonts:
    image: maptiler/tileserver-gl:latest
    container_name: gp_fonts
    ports:
      - "8099:8080"
    volumes:
      - ./fonts:/data/fonts:ro
      - ./styles:/data/styles:ro
      - ./config.fonts.json:/data/config.json:ro
    command: ["-c", "/data/config.json"]
    restart: unless-stopped

  gp_tiles:
    image: ghcr.io/consbio/mbtileserver:latest
    container_name: gp_tiles
    command: ["--port", "8000", "--dir", "/data"]
    volumes:
      - ./docker-data/tiles:/data:ro
    ports:
      - "8088:8000"
    restart: unless-stopped


volumes:
  pgdata:
  redisdata:
  gp_uploads:
