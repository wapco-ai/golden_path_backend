name: backend-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guardrails:
    name: repository-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify repository guardrails
        run: bash scripts/ci/repository_guardrails.sh

  php-static:
    name: php-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Verify locked dependencies install
        run: >
          composer install
          --no-interaction
          --prefer-dist
          --no-progress
          --no-scripts

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Guidance source and coverage contract tests (mocked DB, no database server)
        run: vendor/bin/phpunit tests/Feature --filter='Guidance(ImageSource|Coverage)Test'

      - name: Cultural media upload validation tests (no database server)
        run: vendor/bin/phpunit tests/Feature/CulturalMediaUploadTest.php

      - name: Admin authorization HTTP tests (isolated SQLite)
        run: vendor/bin/phpunit tests/Feature/AdminAuthorizationTest.php

      - name: Guidance form role upgrade and rollback (isolated SQLite)
        run: vendor/bin/phpunit tests/Feature/GuidanceRoleMigrationTest.php

      - name: Category JSON and multipart validation contracts (no database server)
        run: vendor/bin/phpunit tests/Feature/CategoryRequestValidationTest.php

      - name: Registered-user status and date validation contracts (no database server)
        run: vendor/bin/phpunit tests/Feature/SignedUserRequestValidationTest.php

      - name: Employer direct OTP authentication contracts (isolated SQLite, fake HTTP)
        run: vendor/bin/phpunit -c phpunit.xml tests/Feature/RazaviDirectAuthTest.php

      - name: Admin notification read and list validation contracts (no database server)
        run: vendor/bin/phpunit tests/Feature/DashboardNotificationRequestValidationTest.php

      - name: Public profile name contract tests (no database server)
        run: vendor/bin/phpunit tests/Feature/ProfileNameContractTest.php

      - name: Location sharing contract tests (no database server)
        run: vendor/bin/phpunit tests/Feature/LocationShareContractTest.php

      - name: Route history contract tests (no database server)
        run: vendor/bin/phpunit tests/Feature/RouteHistoryContractTest.php

      - name: Navigation settings authorization, validation and persistence
        run: vendor/bin/phpunit tests/Feature/NavigationSettingsTest.php

  multifloor-integration:
    name: multifloor-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 16, PostGIS 3.5 and pgRouting 3.7 in an isolated test database.
        image: pgrouting/pgrouting:16-3.5-3.7@sha256:bd6d68ab68fc8aa50f8e1680e5942d781761c203d68dc5e61b0918fe113ff1db
        env:
          POSTGRES_DB: golden_path_connector_test
          POSTGRES_PASSWORD: connector_test_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d golden_path_connector_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none
      - name: Load immutable baseline and versioned changes
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/baseline/2026-08-26/golden_path.schema.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_160000_multifloor_connectors.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_160100_multifloor_routing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261005_170000_diverse_route_alternatives.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_203000_location_sharing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_204000_route_history_index.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260917_180000_public_place_floors.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261010_220000_multifloor_generic_connection.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_160000_cultural_content_created_at.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260918_160000_poi_endpoint_search.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_180000_cultural_landmark_images.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_200000_category_created_at.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_220000_user_manual_activation_at.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_230000_admin_notification_reads.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261019_000000_user_auth_identities.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261107_110000_hide_private_area_graph.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_120000_public_engineering_map.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/tests/public_engineering_map_test.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_160000_enduser_feedback_delivery.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_090000_manual_door_display_wall.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f scripts/manual_door_display_wall_test.sql
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
        working-directory: src
      - name: Real database, HTTP and routing tests
        run: vendor/bin/phpunit -c phpunit.integration.xml --testsuite Unit,Feature
        working-directory: src

      - name: Verify empty-schema rollback and reapply
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_090000_manual_door_display_wall.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_120000_public_engineering_map.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261107_110000_hide_private_area_graph.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261019_000000_user_auth_identities.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_230000_admin_notification_reads.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_220000_user_manual_activation_at.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_200000_category_created_at.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_180000_cultural_landmark_images.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260918_160000_poi_endpoint_search.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_160000_cultural_content_created_at.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261010_220000_multifloor_generic_connection.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260917_180000_public_place_floors.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_204000_route_history_index.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_203000_location_sharing.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261005_170000_diverse_route_alternatives.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_160100_multifloor_routing.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_160000_multifloor_connectors.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_160000_multifloor_connectors.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_160100_multifloor_routing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261005_170000_diverse_route_alternatives.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_203000_location_sharing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260915_204000_route_history_index.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260917_180000_public_place_floors.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261010_220000_multifloor_generic_connection.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_160000_cultural_content_created_at.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20260918_160000_poi_endpoint_search.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_180000_cultural_landmark_images.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_200000_category_created_at.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_220000_user_manual_activation_at.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261018_230000_admin_notification_reads.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261019_000000_user_auth_identities.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261107_110000_hide_private_area_graph.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_120000_public_engineering_map.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_090000_manual_door_display_wall.up.sql

      - name: Rehearse same-floor stair migrations
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_090000_nearby_route_destination.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_100000_expand_nearby_route_radius.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_110000_nearby_route_origin.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_130000_same_floor_stairs.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_140000_same_floor_stair_landing_tolerance.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f scripts/same_floor_stair_runtime_acl_test.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_150000_same_floor_stair_runtime_acl.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f scripts/same_floor_stairs_test.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_150000_same_floor_stair_runtime_acl.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_140000_same_floor_stair_landing_tolerance.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_130000_same_floor_stairs.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_130000_same_floor_stairs.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_140000_same_floor_stair_landing_tolerance.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261109_150000_same_floor_stair_runtime_acl.up.sql
      - name: Verify zero-length nearby route clipping and migration rollback
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_140000_nearby_zero_length_edges.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/tests/nearby_zero_length_edges_test.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_140000_nearby_zero_length_edges.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_140000_nearby_zero_length_edges.up.sql
      - name: Verify stair landing move migration and rollback
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_190000_preserve_same_floor_stair_landing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_190000_preserve_same_floor_stair_landing.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_190000_preserve_same_floor_stair_landing.up.sql

      - name: Rehearse routing timing and navigation policy migrations
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_160000_explicit_door_endpoints.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_150000_configurable_route_timing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_120000_navigation_policy.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_130000_exact_door_route_timing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/tests/navigation_policy_test.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_130000_exact_door_route_timing.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_120000_navigation_policy.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_150000_configurable_route_timing.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_150000_configurable_route_timing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_120000_navigation_policy.up.sql

          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_130000_exact_door_route_timing.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/tests/navigation_policy_test.sql

      - name: Rehearse per-floor connector access migration
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_140000_connector_access_by_floor.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_140000_connector_access_by_floor.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_140000_connector_access_by_floor.up.sql

      - name: Rehearse route endpoint performance migration
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_150000_optimize_route_endpoints.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_150000_optimize_route_endpoints.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_150000_optimize_route_endpoints.up.sql

      - name: Same-floor stair HTTP and routing tests
        run: vendor/bin/phpunit -c phpunit.integration.xml --testsuite SameFloorStairs
        working-directory: src

      - name: Exact door endpoint tests
        env:
          PGPASSWORD: connector_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_160000_connect_one_sided_doors.up.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/tests/one_sided_door_graph_test.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_160000_connect_one_sided_doors.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_160000_connect_one_sided_doors.up.sql
          cd src
          vendor/bin/phpunit -c phpunit.integration.xml tests/Feature/ExplicitDoorRouteTest.php
          cd ..
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_160000_connect_one_sided_doors.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_150000_optimize_route_endpoints.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261111_140000_connector_access_by_floor.down.sql
          psql -h 127.0.0.1 -U postgres -d golden_path_connector_test -v ON_ERROR_STOP=1 -f db/changes/20261110_160000_explicit_door_endpoints.down.sql
