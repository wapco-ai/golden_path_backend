name: backend-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guardrails:
    name: repository-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify repository guardrails
        run: bash scripts/ci/repository_guardrails.sh

  php-static:
    name: php-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Verify locked dependencies install
        run: >
          composer install
          --no-interaction
          --prefer-dist
          --no-progress
          --no-scripts

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
