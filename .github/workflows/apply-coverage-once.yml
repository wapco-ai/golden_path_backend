name: apply-coverage-once
on:
  push:
    branches: [fix/guidance-coverage-radius]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'wapco-ai/golden_path_backend' && github.ref == 'refs/heads/fix/guidance-coverage-radius'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/guidance-coverage-radius
      - name: Apply reviewed coverage-only edits to exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          edits = {
              'src/app/Http/Controllers/Api/Admin/GuidancePointController.php': ('89c7efc142ca232d5243da5d86e7da38b329c344', [
                  ('COALESCE(?, 10.00)', 'COALESCE(?, 100.00)'),
                  ("$data['coverage_radius_m'] ?? 10.00", "$data['coverage_radius_m'] ?? 100.00"),
                  ("'coverage_radius_m' => ['sometimes', 'numeric', 'gt:0', 'lte:100']", "'coverage_radius_m' => ['sometimes', 'required', 'numeric', 'min:0.01', 'lte:100', 'decimal:0,2']"),
              ]),
              'src/app/Http/Controllers/Api/LandmarkController.php': ('a92d6f1ff21474b2d8facab7f825431e1d22a917', [
                  ('COALESCE(gp.coverage_radius_m, 10)', 'COALESCE(gp.coverage_radius_m, 100)'),
              ]),
              '.github/workflows/ci.yml': ('05c805ff731278238a7253ec9f72db08ce8216ab', [
                  ('vendor/bin/phpunit tests/Feature/GuidanceImageSourceTest.php', "vendor/bin/phpunit tests/Feature --filter='Guidance(ImageSource|Coverage)Test'"),
              ]),
          }
          for path, (expected, replacements) in edits.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == expected, path
              p = Path(path); s = p.read_text()
              for old, new in replacements:
                  assert s.count(old) == 1, (path, old, s.count(old))
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          git diff --check
          php -l src/app/Http/Controllers/Api/Admin/GuidancePointController.php
          php -l src/app/Http/Controllers/Api/LandmarkController.php
          php -l src/tests/Feature/GuidanceCoverageTest.php
          php -l src/database/migrations/2026_09_08_180000_set_guidance_coverage_default_to_100.php
          git rm .github/workflows/apply-coverage-once.yml
          git add src/app/Http/Controllers/Api/Admin/GuidancePointController.php src/app/Http/Controllers/Api/LandmarkController.php .github/workflows/ci.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: align API and selection coverage defaults with 100 metres'
          git push origin HEAD:refs/heads/fix/guidance-coverage-radius
